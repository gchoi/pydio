services:
  pydio:
    image: pydio/cells:latest
    env_file: ./docker.env
    restart: unless-stopped
    hostname: pydio-cells
    ports:
      - "8080:8080"
    volumes:
      - ./docker-volume/cellsdir:/var/cells
      - ./docker-volume/data:/var/cells/data
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    env_file: ./docker.env
    restart: unless-stopped
    ports:
      - "3306:3306"
    # Required command to support Pydio's encoding requirements
    command:
      [
        mysqld,
        --character-set-server=utf8mb4,
        --collation-server=utf8mb4_unicode_ci,
      ]
    volumes:
      - ./docker-volume/mysqldir:/var/lib/mysql

volumes:
  data: {}
  cellsdir: {}
  mysqldir: {}
